<main class="main">
  @if (isLoading()) {
    <div class="loading-state">
      <span class="spinner spinner--large"></span>
      <p>Loading portfolio...</p>
    </div>
  } @else if (loadError()) {
    <div class="error-state">
      <p class="error-state__msg">{{ loadError() }}</p>
      <button class="refresh-button" (click)="refreshData()">Retry</button>
    </div>
  } @else {
    <app-portfolio-summary
      [excludedItems]="excludedItems()"
      [isRefreshing]="isRefreshing()"
      [summary]="portfolioData().summary"
      (onAddItem)="showAddModal.set(true)"
      (onRefreshData)="refreshData()" />
    <div class="content">
      <div class="content__toolbar">
        <button class="view-toggle" (click)="toggleGroupByType()">
          {{ groupByType() ? 'Simple View' : 'Group View' }}
        </button>
        @if (!groupByType()) {
          @if (!isReorderMode()) {
            <button class="view-toggle" (click)="startReorderMode()">
              Rearrange Items
            </button>
          } @else {
            <button class="view-toggle view-toggle--positive" (click)="saveOrder()">
              Save Order
            </button>
            <button
              class="view-toggle view-toggle--negative"
              (click)="cancelReorderMode()">
              Cancel
            </button>
          }
        }
        <button class="view-toggle" (click)="exportCsv()">Export CSV</button>
        <button class="view-toggle" (click)="exportJson()">Export JSON</button>
        <button class="view-toggle" (click)="importJson()">Import JSON</button>
      </div>
      <div class="content__table-wrapper">
        <app-shares-table
          [currencyData]="currencyData()"
          [data]="portfolioData().items"
          [groupByType]="groupByType()"
          [isReorderMode]="isReorderMode()"
          (onAddItem)="showAddModal.set(true)"
          (reorderDraftChanged)="onReorderDraftChanged($event)"
          (portfolioUpdated)="onPortfolioUpdated($event)" />
      </div>
    </div>
  }
</main>

@if (showAddModal()) {
  <app-modal title="Add New Item" (close)="showAddModal.set(false)">
    <app-add-item-modal
      (close)="showAddModal.set(false)"
      (itemSubmit)="addItem($event)" />
  </app-modal>
}

<router-outlet />
